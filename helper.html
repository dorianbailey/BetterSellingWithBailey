<!doctype html><meta charset="utf-8"><title>helper</title>
<script>
(async()=>{const f=decodeURIComponent(location.hash.slice(1));
try{const r=await fetch(f);if(!r.ok)throw new Error('HTTP '+r.status);const b=await r.arrayBuffer();
parent.postMessage({__bsb:1,name:f,buf:b},'*',[b]);}catch(e){parent.postMessage({__bsb:1,err:String(e)},'*')}})();
</script>
