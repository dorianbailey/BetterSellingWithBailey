<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#191714">
<title>Team Scanning Activity · Better Selling With Bailey</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="preconnect" href="https://qnsomzxhnagzjwjhetzu.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
:root{--ink:#191714;--gold:#C9A84C;--gold-deep:#8A6A1C;--cream:#FAF7F2;--line:#e6dfd2;--muted:#6f685e;--soft:#f2ece1;--bad:#b3412e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'Public Sans',system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
.top{background:var(--ink);color:var(--cream);padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 18px}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.b{width:36px;height:36px;border-radius:9px;border:1px solid rgba(201,168,76,.65);color:var(--gold);font:700 22px/34px 'Playfair Display',Georgia,serif;text-align:center;flex:none}
.top h1{font:700 22px/1.2 'Playfair Display',Georgia,serif;margin:0}
.top small{display:block;font-size:12px;letter-spacing:.06em;color:rgba(250,247,242,.65);margin-top:2px}
.top .spacer{flex:1}
.top a{color:var(--gold);font-size:14px;font-weight:600;text-decoration:none}
main{max-width:1100px;margin:0 auto;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 40px)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tabs{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;gap:2px}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--gold)}
.bar .spacer{flex:1}
.updated{font-size:13px;color:var(--muted)}
.ghost{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat span{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font:900 30px/1.15 'Playfair Display',Georgia,serif;margin-top:4px;font-variant-numeric:tabular-nums}
.stat em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:2px}
h2{font:700 20px/1.2 'Playfair Display',Georgia,serif;margin:6px 0 12px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-bottom:28px}
.person{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;cursor:pointer;transition:border-color .15s,box-shadow .15s;text-align:left;width:100%}
.person:hover{border-color:#d6c9a8}
.person.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,168,76,.35)}
.p-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.p-name{font:700 19px/1.2 'Playfair Display',Georgia,serif}
.p-count{font:900 26px/1 'Playfair Display',Georgia,serif;font-variant-numeric:tabular-nums}
.p-count small{font:600 12px 'Public Sans',sans-serif;color:var(--muted);margin-left:4px}
.p-span{font-size:13.5px;color:var(--muted);margin-top:4px}
.p-facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.p-clock{font-size:13.5px;margin-top:6px;color:var(--muted)}
.p-clock.on{color:#2f7a45;font-weight:600}
.p-clock.on::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#3fa35c;margin-right:7px;vertical-align:1px}
.p-clock.none{font-style:italic}
.p-facts em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:1px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:12px;white-space:nowrap}
.pill.on{background:#e3f4e7;color:#2f7a45}
.pill.warn{background:#fbecd5;color:#8a5a12}
.section{margin-bottom:28px}
.p-facts div{background:var(--soft);border-radius:10px;padding:8px 10px}
.p-facts span{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.p-facts b{display:block;font-size:15px;margin-top:2px;font-variant-numeric:tabular-nums}
.p-breaks{font-size:13px;color:var(--muted);margin-top:10px}
.p-breaks.warn{color:#8a5a12}
.hours{display:flex;align-items:flex-end;gap:3px;height:54px;margin-top:14px;padding-bottom:16px;position:relative}
.hours .h{flex:1;position:relative;height:100%;display:flex;align-items:flex-end}
.hours .h i{display:block;width:100%;background:var(--gold);border-radius:3px 3px 0 0;min-height:0}
.hours .h.zero i{background:#eee5d3;height:3px!important}
.hours .h em{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;color:var(--muted);white-space:nowrap}
.list-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.list-head .filter{font-size:14px;color:var(--muted)}
.list-head .filter button{border:0;background:none;color:var(--gold-deep);font-weight:700;cursor:pointer;padding:0;margin-left:4px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
th{border-top:0;background:var(--soft);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.time{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}
td.gap{white-space:nowrap;color:var(--muted);font-size:13px}
td.gap.long{color:#8a5a12;font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 7px;border-radius:10px;background:#efe8da;color:#5d4b16;margin-left:6px;vertical-align:1px}
.miss{color:var(--muted);font-style:italic}
.empty{background:#fff;border:1px dashed #d8cdb6;border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
.more{margin-top:10px;text-align:center}
/* login */
.gate{max-width:420px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 24px}
.gate h2{margin:0 0 8px}
.gate p{color:var(--muted);margin:0 0 16px;line-height:1.5}
.gate input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;margin-bottom:12px;outline:none}
.gate input:focus{border-color:var(--gold)}
.gate button{width:100%;min-height:50px;border-radius:12px;border:0;background:var(--ink);color:var(--gold);font-weight:700;font-size:15.5px;cursor:pointer}
.gate .err{color:var(--bad);font-size:14px;min-height:20px;margin:10px 0 0}
[hidden]{display:none!important}
@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .people{grid-template-columns:1fr}
  .hide-sm{display:none}
  th,td{padding:9px 8px}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="b">B</div>
  <div><h1>Team scanning activity</h1><small>BETTER SELLING WITH BAILEY · OWNER VIEW</small></div>
  <div class="spacer"></div>
  <a href="../">‹ Back to scanner</a>
</div></header>

<main>
  <section id="gate" class="gate" hidden>
    <h2>Owner sign-in</h2>
    <p id="gateMsg">Enter the owner password to see who scanned what, and when.</p>
    <input id="ownerIn" type="password" autocomplete="current-password" autocapitalize="characters" spellcheck="false" placeholder="Owner password">
    <button id="ownerGo" type="button">Show activity</button>
    <p class="err" id="gateErr"></p>
  </section>

  <section id="app" hidden>
    <div class="bar">
      <div class="tabs" role="group" aria-label="Date range">
        <button type="button" data-range="today" aria-pressed="true">Today</button>
        <button type="button" data-range="yesterday" aria-pressed="false">Yesterday</button>
        <button type="button" data-range="7" aria-pressed="false">7 days</button>
        <button type="button" data-range="30" aria-pressed="false">30 days</button>
      </div>
      <div class="spacer"></div>
      <span class="updated" id="updated"></span>
      <button class="ghost" id="refresh" type="button">Refresh</button>
    </div>

    <div class="stats">
      <div class="stat"><span>Items scanned</span><b id="sTotal">0</b><em id="sTotalSub"></em></div>
      <div class="stat"><span>On the clock now</span><b id="sOn">0</b><em id="sOnSub"></em></div>
      <div class="stat"><span>Hours on the clock</span><b id="sHours">–</b><em id="sHoursSub"></em></div>
      <div class="stat"><span>Items per clocked hour</span><b id="sRate">–</b><em>whole team</em></div>
    </div>

    <h2>By person</h2>
    <div class="people" id="people"></div>

    <div class="section"><div class="list-head"><h2>Time clock</h2><span class="filter" id="clockFilter"></span></div><div id="clockWrap"></div></div>

    <div class="list-head"><h2>Every scan</h2><span class="filter" id="filter"></span></div>
    <div id="listWrap"></div>
  </section>
</main>

<script>
(() => {
'use strict';
const API = 'https://qnsomzxhnagzjwjhetzu.supabase.co/functions/v1/price-scanner';
const KEY = 'bsb_owner_pass';
const BREAK_MIN = 20;          // a gap longer than this between scans counts as a break
const STALE_H = 16;            // an open shift older than this was a forgotten clock-out
const $ = (s) => document.querySelector(s);
let OWNER = ''; try { OWNER = localStorage.getItem(KEY) || ''; } catch (e) {}
let rows = [], shifts = [], range = 'today', person = null, shown = 150, timer = null;

const money = (n) => n == null ? '–' : '$' + Math.round(n).toLocaleString('en-US');
const tfmt = (d) => d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
const dfmt = (d) => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
const keyOf = (n) => (n || 'Unknown').trim().toLowerCase();
function dur(sec) {
  if (sec == null || !isFinite(sec)) return '–';
  if (sec < 90) return Math.round(sec) + 's';
  const m = Math.round(sec / 60); if (m < 90) return m + ' min';
  const h = Math.floor(m / 60), r = m % 60; return h + 'h' + (r ? ' ' + r + 'm' : '');
}
function median(a) { if (!a.length) return null; const s = a.slice().sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }

function bounds() {
  const now = new Date(), start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (range === 'today') return [start, null, 2];
  if (range === 'yesterday') return [new Date(start.getTime() - 86400000), start, 3];
  const days = +range; return [new Date(start.getTime() - (days - 1) * 86400000), null, days + 1];
}

async function load() {
  const [, , fetchDays] = bounds();
  $('#updated').textContent = 'Loading…';
  try {
    const res = await fetch(API + '?activity=1&days=' + fetchDays, { method: 'POST', headers: { 'x-owner-pass': OWNER } });
    if (res.status === 401) { OWNER = ''; try { localStorage.removeItem(KEY); } catch (e) {} gate('That owner password didn\'t work. Enter it again.'); return false; }
    const j = await res.json().catch(() => ({}));
    if (!res.ok) { gate(j.error && j.error.type === 'owner_not_set' ? 'No owner password has been set up yet.' : 'Couldn\'t load activity right now. Try again in a minute.'); return false; }
    rows = (j.rows || []).map((r) => Object.assign(r, { at: new Date(r.created_at) }));
    const now = Date.now();
    shifts = (j.shifts || []).map((s) => {
      const tin = new Date(s.clock_in), tout = s.clock_out ? new Date(s.clock_out) : null;
      const open = !tout, stale = open && now - tin > STALE_H * 3600000;
      return Object.assign(s, { tin, tout, open: open && !stale, stale });
    });
    $('#updated').textContent = 'Updated ' + tfmt(new Date());
    render();
    return true;
  } catch (e) {
    $('#updated').textContent = 'Couldn\'t reach the server';
    return false;
  }
}

function inRange() {
  const [a, b] = bounds();
  return rows.filter((r) => r.at >= a && (!b || r.at < b)).sort((x, y) => x.at - y.at);
}
// shifts overlapping the range, with the part inside the range measured
function shiftsInRange() {
  const [a, b] = bounds(), end = b || new Date();
  return shifts.map((s) => {
    const sEnd = s.tout || (s.stale ? s.tin : new Date());
    const from = Math.max(s.tin, a), to = Math.min(sEnd, end);
    return Object.assign({}, s, { sEnd, secIn: Math.max(0, (to - from) / 1000) });
  }).filter((s) => s.tin < end && (s.open || s.sEnd >= a)).sort((x, y) => y.tin - x.tin);
}

function statsFor(list) {
  const scans = list.filter((r) => r.kind === 'scan' && r.ok);
  const reprices = list.filter((r) => r.kind === 'reprice' && r.ok).length;
  const misses = list.filter((r) => !r.ok).length;
  const gaps = [], breaks = [];
  let workSec = 0;
  for (let i = 1; i < scans.length; i++) {
    const g = (scans[i].at - scans[i - 1].at) / 1000;
    if (g > BREAK_MIN * 60) breaks.push(g); else { gaps.push(g); workSec += g; }
  }
  const days = new Set(scans.map((r) => r.at.toDateString())).size;
  return { scans, reprices, misses, gaps, breaks, workSec, days, first: scans[0] && scans[0].at, last: scans.length && scans[scans.length - 1].at };
}

function render() {
  const list = inRange(), sh = shiftsInRange();
  const singleDay = range === 'today' || range === 'yesterday';
  const label = singleDay ? dfmt(bounds()[0]) : 'last ' + range + ' days';

  // everyone who scanned or clocked in, matched by name (ignoring capitals)
  const people = new Map();
  const get = (name) => { const k = keyOf(name); if (!people.has(k)) people.set(k, { key: k, name: (name || 'Unknown').trim(), rows: [], shifts: [] }); return people.get(k); };
  for (const s of sh) get(s.scanner).shifts.push(s);
  for (const r of list) get(r.scanner).rows.push(r);
  const per = [...people.values()].map((p) => {
    const st = statsFor(p.rows);
    const clockSec = p.shifts.reduce((t, s) => t + s.secIn, 0);
    const openShift = p.shifts.find((s) => s.open);
    return Object.assign(p, { st, clockSec, openShift, rate: clockSec >= 600 ? st.scans.length / (clockSec / 3600) : null });
  }).sort((x, y) => (y.openShift ? 1 : 0) - (x.openShift ? 1 : 0) || y.st.scans.length - x.st.scans.length);

  // summary
  const team = statsFor(list);
  const onNow = per.filter((p) => p.openShift);
  const clockTotal = per.reduce((t, p) => t + p.clockSec, 0);
  const scansClocked = per.filter((p) => p.clockSec > 0).reduce((t, p) => t + p.st.scans.length, 0);
  $('#sTotal').textContent = team.scans.length.toLocaleString('en-US');
  $('#sTotalSub').textContent = [team.reprices ? team.reprices + ' re-priced' : '', team.misses ? team.misses + ' no item found' : ''].filter(Boolean).join(' · ') || label;
  $('#sOn').textContent = onNow.length;
  $('#sOnSub').textContent = onNow.length ? onNow.map((p) => p.name).join(', ') : 'Nobody right now';
  $('#sHours').textContent = clockTotal ? dur(clockTotal) : '–';
  $('#sHoursSub').textContent = label;
  $('#sRate').textContent = clockTotal >= 600 ? Math.round(scansClocked / (clockTotal / 3600)) : '–';

  // hour strip scale (single-day views)
  let h0 = 24, h1 = -1;
  if (singleDay) {
    for (const r of list) { const h = r.at.getHours(); h0 = Math.min(h0, h); h1 = Math.max(h1, h); }
    for (const s of sh) {
      const from = new Date(Math.max(s.tin, bounds()[0])), to = new Date(Math.min(s.sEnd, bounds()[1] || new Date()));
      if (to >= from) { h0 = Math.min(h0, from.getHours()); h1 = Math.max(h1, to.getHours()); }
    }
  }
  let maxPerHour = 1;
  const hourCounts = {};
  if (singleDay) for (const p of per) {
    const c = new Array(24).fill(0); for (const r of p.st.scans) c[r.at.getHours()]++;
    hourCounts[p.key] = c; maxPerHour = Math.max(maxPerHour, ...c);
  }

  const box = $('#people'); box.textContent = '';
  if (!per.length) {
    const d = document.createElement('div'); d.className = 'empty';
    d.textContent = singleDay ? 'Nobody has clocked in or scanned ' + (range === 'today' ? 'yet today.' : 'yesterday.') : 'No activity in the last ' + range + ' days.';
    box.appendChild(d);
  }
  for (const p of per) {
    const st = p.st;
    const card = document.createElement('button'); card.type = 'button';
    card.className = 'person' + (person === p.key ? ' sel' : '');
    card.addEventListener('click', () => { person = person === p.key ? null : p.key; shown = 150; render(); });
    card.innerHTML = '<div class="p-head"><span class="p-name"></span><span class="p-count"></span></div><div class="p-clock"></div><div class="p-span"></div>' +
      '<div class="p-facts"><div><span>On the clock</span><b class="f1"></b></div><div><span>Actively scanning</span><b class="f2"></b><em class="f2e"></em></div>' +
      '<div><span>Per clocked hour</span><b class="f3"></b></div><div><span>Typical gap</span><b class="f4"></b></div></div><div class="p-breaks"></div>';
    card.querySelector('.p-name').textContent = p.name;
    const cnt = card.querySelector('.p-count'); cnt.textContent = st.scans.length;
    const sm = document.createElement('small'); sm.textContent = 'scans' + (st.reprices ? ' · ' + st.reprices + ' re-priced' : ''); cnt.appendChild(sm);

    const cl = card.querySelector('.p-clock');
    if (p.openShift) { cl.classList.add('on'); cl.textContent = 'On the clock since ' + tfmt(p.openShift.tin) + ' · ' + dur((Date.now() - p.openShift.tin) / 1000); }
    else if (p.shifts.length) {
      cl.textContent = singleDay
        ? 'Clocked ' + p.shifts.slice().reverse().map((s) => tfmt(s.tin) + ' – ' + (s.tout ? tfmt(s.tout) : '?')).join(', ')
        : p.shifts.length + ' shift' + (p.shifts.length === 1 ? '' : 's') + ' · last ' + dfmt(p.shifts[0].tin);
      if (p.shifts.some((s) => s.auto_closed || s.stale)) cl.textContent += ' · forgot to clock out';
    } else { cl.classList.add('none'); cl.textContent = 'Didn\'t clock in'; }

    card.querySelector('.p-span').textContent = !st.scans.length ? 'No priced scans'
      : singleDay ? 'Scanned ' + tfmt(st.first) + ' – ' + tfmt(st.last)
      : st.days + ' day' + (st.days === 1 ? '' : 's') + ' scanning · ' + (st.days ? Math.round(st.scans.length / st.days) + ' scans a day' : '');
    card.querySelector('.f1').textContent = p.clockSec ? dur(p.clockSec) : '–';
    card.querySelector('.f2').textContent = st.workSec ? dur(st.workSec) : '–';
    card.querySelector('.f2e').textContent = p.clockSec >= 600 && st.workSec ? Math.min(100, Math.round(st.workSec / p.clockSec * 100)) + '% of clocked time' : '';
    card.querySelector('.f3').textContent = p.rate != null ? Math.round(p.rate) + ' items' : '–';
    card.querySelector('.f4').textContent = dur(median(st.gaps));
    const br = card.querySelector('.p-breaks');
    const longest = st.breaks.length ? Math.max(...st.breaks) : null;
    if (st.breaks.length) {
      br.textContent = st.breaks.length + ' break' + (st.breaks.length === 1 ? '' : 's') + ' over ' + BREAK_MIN + ' min · longest ' + dur(longest) + ' · ' + dur(st.breaks.reduce((x, y) => x + y, 0)) + ' total';
      if (singleDay && longest > 45 * 60) br.classList.add('warn');
    } else br.textContent = st.scans.length > 1 ? 'No gaps over ' + BREAK_MIN + ' min' : '';
    if (singleDay && h1 >= h0 && hourCounts[p.key]) {
      const hrs = document.createElement('div'); hrs.className = 'hours';
      for (let h = h0; h <= h1; h++) {
        const n = hourCounts[p.key][h];
        const col = document.createElement('div'); col.className = 'h' + (n ? '' : ' zero');
        col.title = n + ' scan' + (n === 1 ? '' : 's') + ' ' + ((h % 12) || 12) + (h < 12 ? 'am' : 'pm');
        const bar = document.createElement('i'); bar.style.height = Math.max(4, Math.round(n / maxPerHour * 38)) + 'px';
        col.appendChild(bar);
        if ((h - h0) % 2 === 0 || h1 - h0 < 6) { const lab = document.createElement('em'); lab.textContent = ((h % 12) || 12) + (h < 12 ? 'a' : 'p'); col.appendChild(lab); }
        hrs.appendChild(col);
      }
      card.appendChild(hrs);
    }
    box.appendChild(card);
  }

  const nameOf = (k) => (people.get(k) || {}).name || k;
  const filterBar = (el) => {
    el.textContent = '';
    if (!person) return;
    el.append('Showing ' + nameOf(person) + ' only');
    const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Show everyone';
    b.addEventListener('click', () => { person = null; render(); }); el.appendChild(b);
  };

  // time clock table
  filterBar($('#clockFilter'));
  const cw = $('#clockWrap'); cw.textContent = '';
  const shown_sh = person ? sh.filter((s) => keyOf(s.scanner) === person) : sh;
  if (!shown_sh.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'No clock-ins for this range.'; cw.appendChild(d); }
  else {
    const t = document.createElement('table');
    t.innerHTML = '<thead><tr><th>Person</th><th class="hide-sm">Day</th><th>In</th><th>Out</th><th class="num">On the clock</th><th class="num">Items</th><th class="hide-sm"></th></tr></thead>';
    const tb = document.createElement('tbody');
    for (const s of shown_sh) {
      const tr = document.createElement('tr');
      const td = (cls, txt) => { const c = document.createElement('td'); if (cls) c.className = cls; if (txt != null) c.textContent = txt; tr.appendChild(c); return c; };
      const end = s.tout || (s.open ? new Date() : null);
      const items = rows.filter((r) => keyOf(r.scanner) === keyOf(s.scanner) && r.kind === 'scan' && r.ok && r.at >= s.tin && (!end || r.at <= end)).length;
      td('', s.scanner);
      td('time hide-sm', dfmt(s.tin));
      td('time', tfmt(s.tin));
      const outCell = td('time', s.tout ? tfmt(s.tout) : '');
      if (!s.tout) { const pl = document.createElement('span'); pl.className = 'pill ' + (s.open ? 'on' : 'warn'); pl.textContent = s.open ? 'On the clock' : 'Never clocked out'; outCell.appendChild(pl); }
      td('num', s.tout || s.open ? dur(((s.tout || new Date()) - s.tin) / 1000) : '–');
      td('num', items);
      const note = td('hide-sm');
      if (s.auto_closed) { const pl = document.createElement('span'); pl.className = 'pill warn'; pl.textContent = 'Forgot to clock out · closed at last scan'; note.appendChild(pl); }
      tb.appendChild(tr);
    }
    t.appendChild(tb); cw.appendChild(t);
  }

  // every scan, newest first, with the gap since that person's previous scan
  filterBar($('#filter'));
  const items = (person ? list.filter((r) => keyOf(r.scanner) === person) : list).slice().reverse();
  const prevByPerson = {};
  const gapOf = new Map();
  for (const r of list) { if (r.kind !== 'scan' || !r.ok) continue; const k = keyOf(r.scanner); if (prevByPerson[k]) gapOf.set(r, (r.at - prevByPerson[k]) / 1000); prevByPerson[k] = r.at; }
  const wrap = $('#listWrap'); wrap.textContent = '';
  if (!items.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Nothing to show for this range.'; wrap.appendChild(d); return; }
  const t = document.createElement('table');
  t.innerHTML = '<thead><tr><th>Time</th><th>Person</th><th>Item</th><th class="num">Tag price</th><th class="hide-sm">Since last scan</th></tr></thead>';
  const tb = document.createElement('tbody');
  for (const r of items.slice(0, shown)) {
    const tr = document.createElement('tr');
    const td = (cls, txt) => { const c = document.createElement('td'); if (cls) c.className = cls; if (txt != null) c.textContent = txt; tr.appendChild(c); return c; };
    td('time', (singleDay ? '' : r.at.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ') + tfmt(r.at));
    td('', r.scanner || 'Unknown');
    const it = td('');
    if (r.ok) { it.textContent = r.item || ''; if (r.kind === 'reprice') { const tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = 'RE-PRICED'; it.appendChild(tg); } }
    else { it.className = 'miss'; it.textContent = 'No item found'; }
    td('num', r.ok ? money(r.price) : '');
    const g = gapOf.get(r);
    const gc = td('gap hide-sm' + (g > BREAK_MIN * 60 ? ' long' : ''), g == null ? '' : dur(g));
    if (g > BREAK_MIN * 60) gc.title = 'Break';
    tb.appendChild(tr);
  }
  t.appendChild(tb); wrap.appendChild(t);
  if (items.length > shown) {
    const m = document.createElement('div'); m.className = 'more';
    const b = document.createElement('button'); b.className = 'ghost'; b.type = 'button'; b.textContent = 'Show more (' + (items.length - shown) + ' older)';
    b.addEventListener('click', () => { shown += 300; render(); });
    m.appendChild(b); wrap.appendChild(m);
  }
}

function gate(msg) {
  $('#app').hidden = true; $('#gate').hidden = false;
  if (msg) $('#gateMsg').textContent = msg;
  $('#ownerIn').focus();
}
async function signIn() {
  const p = $('#ownerIn').value.trim();
  if (!p) { $('#gateErr').textContent = 'Enter the owner password.'; return; }
  $('#gateErr').textContent = ''; $('#ownerGo').disabled = true; $('#ownerGo').textContent = 'Checking…';
  OWNER = p;
  const ok = await load();
  $('#ownerGo').disabled = false; $('#ownerGo').textContent = 'Show activity';
  if (ok) { try { localStorage.setItem(KEY, p); } catch (e) {} showApp(); }
  else if (!$('#gate').hidden && !$('#gateErr').textContent) $('#gateErr').textContent = 'That didn\'t work. Check the password and your connection.';
}
function showApp() {
  $('#gate').hidden = true; $('#app').hidden = false;
  clearInterval(timer);
  timer = setInterval(() => { if (!document.hidden && range === 'today') load(); }, 60000);
}
$('#ownerGo').addEventListener('click', signIn);
$('#ownerIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') signIn(); });
$('#refresh').addEventListener('click', load);
for (const b of document.querySelectorAll('.tabs button')) b.addEventListener('click', () => {
  for (const x of document.querySelectorAll('.tabs button')) x.setAttribute('aria-pressed', String(x === b));
  range = b.dataset.range; shown = 150; load();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#app').hidden && range === 'today') load(); });

if (!OWNER) gate();
else load().then((ok) => { if (ok) showApp(); });
})();
</script>
</body>
</html>
